name: Deploy Frontend to Railway

# Manual only: the hosted instance is switched off for now, so an automatic deploy on
# every push would just fail. Run it from the Actions tab when hosting is back.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install -g @railway/cli
      - run: railway up --detach --service d8105a94-42bd-4c0e-9767-38d5d93dddd3
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
